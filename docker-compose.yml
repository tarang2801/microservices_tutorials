version: '3.8'

services:
  # PostgreSQL Databases

  postgres-microservice:
    image: postgres:15-alpine
    container_name: postgres-microservices
    environment:
      POSTGRES_DB: microservice
      POSTGRES_USER: microservice_user
      POSTGRES_PASSWORD: microservice_password
    ports:
      - "5437:5432"
    # volumes:
      # - postgres-member-data:/var/lib/postgresql/data
      # - ./infrastructure/postgres/member-init.sql:/docker-entrypoint-initdb.d/member-init.sql
    networks:
      - microservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microservice_user -d microservice"]
      interval: 10s
      timeout: 5s
      retries: 5

